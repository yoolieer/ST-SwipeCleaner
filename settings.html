<div class="swipe-pruner-plugin-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Swipe 清理工具</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="flex-container flexGap10 alignitemscenter">
                <label class="checkbox_label" for="swipe_pruner_plugin_auto_save">
                    <input id="swipe_pruner_plugin_auto_save" type="checkbox" />
                    <span>自动保存</span>
                </label>
                <label class="checkbox_label" for="swipe_pruner_plugin_include_hidden">
                    <input id="swipe_pruner_plugin_include_hidden" type="checkbox" />
                    <span>包括隐藏楼层</span>
                </label>
                <label for="swipe_pruner_plugin_keep_floors">
                    保留最近
                    <input id="swipe_pruner_plugin_keep_floors" class="text_pole widthNatural" type="number" min="0" step="1" style="width: 80px;" />
                    层
                </label>
                <div class="menu_button" id="swipe_pruner_plugin_apply_defaults" title="恢复默认设置">恢复默认</div>
            </div>
            <div class="swipe-pruner-buttons">
                <div class="swipe-pruner-buttons-title">启用按钮：</div>
                <div class="swipe-pruner-button-options">
                    <div class="swipe-pruner-option" data-info="keep">
                        <label class="checkbox_label" for="swipe_pruner_plugin_btn_keep_enabled">
                            <input id="swipe_pruner_plugin_btn_keep_enabled" type="checkbox" />
                            <span>清理当前(保留当前)</span>
                        </label>
                    </div>
                    <div class="swipe-pruner-option" data-info="delete">
                        <label class="checkbox_label" for="swipe_pruner_plugin_btn_delete_enabled">
                            <input id="swipe_pruner_plugin_btn_delete_enabled" type="checkbox" />
                            <span>清理当前(删除指定)</span>
                        </label>
                    </div>
                    <div class="swipe-pruner-option" data-info="prune">
                        <label class="checkbox_label" for="swipe_pruner_plugin_btn_prune_enabled">
                            <input id="swipe_pruner_plugin_btn_prune_enabled" type="checkbox" />
                            <span>清理旧swipe</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
