<div class="st-swipe-cleaner-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Swipe 清理工具</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="flex-container flexGap10 alignitemscenter">
                <label class="checkbox_label" for="st_swipe_cleaner_auto_save">
                    <input id="st_swipe_cleaner_auto_save" type="checkbox" />
                    <span>自动保存</span>
                </label>
                <label class="checkbox_label" for="st_swipe_cleaner_include_hidden">
                    <input id="st_swipe_cleaner_include_hidden" type="checkbox" />
                    <span>包括隐藏楼层</span>
                </label>
                <label for="st_swipe_cleaner_keep_floors">
                    保留最近
                    <input id="st_swipe_cleaner_keep_floors" class="text_pole widthNatural" type="number" min="0" step="1" style="width: 80px;" />
                    层
                </label>
                <div class="menu_button" id="st_swipe_cleaner_apply_defaults" title="恢复默认设置">恢复默认</div>
            </div>
            <div class="st-swipe-cleaner-buttons">
                <div class="st-swipe-cleaner-buttons-title">启用按键：</div>
                <div class="st-swipe-cleaner-button-options">
                    <div class="st-swipe-cleaner-option" data-info="keep">
                        <label class="checkbox_label" for="st_swipe_cleaner_btn_keep_enabled">
                            <input id="st_swipe_cleaner_btn_keep_enabled" type="checkbox" />
                            <span>启用</span>
                        </label>
                        <input id="st_swipe_cleaner_label_keep" class="text_pole st-swipe-cleaner-label-input" type="text" />
                    </div>
                    <div class="st-swipe-cleaner-option" data-info="delete">
                        <label class="checkbox_label" for="st_swipe_cleaner_btn_delete_enabled">
                            <input id="st_swipe_cleaner_btn_delete_enabled" type="checkbox" />
                            <span>启用</span>
                        </label>
                        <input id="st_swipe_cleaner_label_delete" class="text_pole st-swipe-cleaner-label-input" type="text" />
                    </div>
                    <div class="st-swipe-cleaner-option" data-info="prune">
                        <label class="checkbox_label" for="st_swipe_cleaner_btn_prune_enabled">
                            <input id="st_swipe_cleaner_btn_prune_enabled" type="checkbox" />
                            <span>启用</span>
                        </label>
                        <input id="st_swipe_cleaner_label_prune" class="text_pole st-swipe-cleaner-label-input" type="text" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
